server.port=${SERVER_PORT:8080}

# MySQL Database Connection (configured via environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:evchargeflow}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jackson UTC ISO-8601 Timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS Configuration
evchargeflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
evchargeflow.seed.enabled=${SEED_ENABLED:true}
